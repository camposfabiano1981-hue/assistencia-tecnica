# Em cada Pull Request: testa, compila e publica uma PRÉVIA temporária (link comentado no PR).
# Atenção: a prévia usa o mesmo banco de dados do sistema oficial.
name: Prévia

on:
  pull_request:

permissions:
  checks: write
  contents: read
  pull-requests: write

jobs:
  previa:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
      - name: Testar regras de segurança (emulador)
        run: npm run test:regras
      - name: Compilar
        run: npm run build
      - name: Publicar prévia
        if: ${{ vars.FIREBASE_PROJECT_ID != '' }}
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: ${{ vars.FIREBASE_PROJECT_ID }}
          expires: 7d
