# Publica o sistema a cada alteração aprovada na branch main.
# Antes de publicar: testa as regras de segurança e compila o app.
# Configuração (uma vez) no GitHub → Settings → Secrets and variables → Actions:
#   Secret   FIREBASE_SERVICE_ACCOUNT = JSON da conta de serviço (ver LEIA-ME)
#   Variable FIREBASE_PROJECT_ID      = ID do projeto no Firebase
name: Publicar

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: publicar
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
      - name: Testes de unidade (Pix, planilhas)
        run: npm run test:unidade
      - name: Testar regras de segurança (emulador)
        run: npm run test:regras
      - name: Compilar
        run: npm run build
      - name: Publicar site, regras e índices
        if: ${{ vars.FIREBASE_PROJECT_ID != '' }}
        env:
          CONTA_SERVICO: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          trap 'rm -f "$RUNNER_TEMP/conta.json"' EXIT
          printf '%s' "$CONTA_SERVICO" > "$RUNNER_TEMP/conta.json"
          # Mostra qual conta e projeto vêm na chave (não é segredo) para facilitar o diagnóstico.
          node -e '
            const c = JSON.parse(require("fs").readFileSync(process.argv[1], "utf8"));
            console.log("Conta de serviço:", c.client_email, "| projeto da chave:", c.project_id);
          ' "$RUNNER_TEMP/conta.json" \
            || { echo "::error::O secret FIREBASE_SERVICE_ACCOUNT não é o JSON de uma conta de serviço."; exit 1; }
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/conta.json"
          npx firebase deploy --only hosting,firestore:rules,firestore:indexes \
            --project "${{ vars.FIREBASE_PROJECT_ID }}" --non-interactive
