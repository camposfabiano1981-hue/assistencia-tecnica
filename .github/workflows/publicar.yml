# Publica o sistema a cada alteração aprovada na branch main.
# Antes de publicar: testa as regras de segurança e compila o app.
# Configuração (uma vez) no GitHub → Settings → Secrets and variables → Actions:
#   Secret   FIREBASE_SERVICE_ACCOUNT = JSON da conta de serviço (ver LEIA-ME)
#   Variable FIREBASE_PROJECT_ID      = ID do projeto no Firebase
name: Publicar

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: publicar
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
      - name: Testar regras de segurança (emulador)
        run: npm run test:regras
      - name: Compilar
        run: npm run build
      - name: Publicar site, regras e índices
        if: ${{ vars.FIREBASE_PROJECT_ID != '' }}
        env:
          CONTA_SERVICO: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          printf '%s' "$CONTA_SERVICO" > "$RUNNER_TEMP/conta.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/conta.json"
          npx firebase deploy --only hosting,firestore:rules,firestore:indexes \
            --project "${{ vars.FIREBASE_PROJECT_ID }}" --non-interactive
          rm -f "$RUNNER_TEMP/conta.json"
